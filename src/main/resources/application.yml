server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://localhost:8081
          predicates:
            - Path=/patients/**

        - id: doctor-service
          uri: http://localhost:8082
          predicates:
            - Path=/doctors/**

        - id: appointment-service
          uri: http://localhost:8083
          predicates:
            - Path=/appointments/**

management:
  endpoints:
    web:
      exposure:
        include: "*"